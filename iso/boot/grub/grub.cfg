# grub.cfg  —  GRUB 부트 메뉴 설정
#
# GRUB이 ISO를 읽어서 이 파일을 찾으면 부팅 메뉴를 표시함.
# timeout: 몇 초 후 자동 부팅 (0이면 즉시)
# menuentry: 메뉴 항목 하나

set timeout=3
set default=0

menuentry "JaesolOS v0.1 - Phase 1" {
    # multiboot 명령: Multiboot 프로토콜로 커널 파일을 로드
    # (일반 ELF 로드와 달리 Multiboot 헤더를 파싱해서 메모리에 올림)
    multiboot /boot/jaesol.bin
    boot
}
